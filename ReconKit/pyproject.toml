[project]
name = "reconKit"
version = "0.1.0"
description = "A command line tool that scans hosts you specifiy + formates and saves them to an output file"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dnspython>=2.8.0",
    "python-whois>=0.9.6",
    "rich>=14.3.3",
]

[project.scripts]
reconKit = "reconkit.main:main"